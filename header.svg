<svg viewBox="0 0 900 220" width="900" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* ── Nurture palette ── */
    :root {
      --sky:    #a8d8ea;
      --sage:   #b8e0d2;
      --lav:    #d6c9e8;
      --cream:  #fef9ef;
      --teal:   #7bbfcc;
      --dusk:   #8fa9b5;
      --ink:    #1e2f3a;
    }

    /* ── background gradient ── */
    .bg { fill: url(#nurtureBg); }

    /* ── scribble paths ── */
    .horizon {
      fill: none; stroke: var(--sage); stroke-width: 1.8;
      stroke-linecap: round; stroke-dasharray: 1200; stroke-dashoffset: 1200;
      animation: draw 3.2s 0.2s cubic-bezier(.4,0,.2,1) forwards;
    }
    .horizon2 {
      fill: none; stroke: var(--sky); stroke-width: 1.2; opacity: 0.6;
      stroke-linecap: round; stroke-dasharray: 900; stroke-dashoffset: 900;
      animation: draw 2.8s 0.6s ease forwards;
    }
    .cloud-stroke {
      fill: none; stroke: var(--sky); stroke-width: 1.4; stroke-linecap: round;
      stroke-dasharray: 300; stroke-dashoffset: 300;
      animation: draw 1.8s ease forwards;
    }

    /* ── grass blades ── */
    .blade {
      stroke: var(--sage); stroke-width: 1.6; stroke-linecap: round;
      fill: none; opacity: 0;
      animation: grow 0.7s ease forwards;
      transform-origin: bottom;
    }

    /* ── floating particles ── */
    .particle {
      fill: var(--lav); opacity: 0;
      animation: float-particle 6s ease-in-out infinite;
    }

    /* ── title text ── */
    .title {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 42px; font-weight: 700; letter-spacing: 2px;
      fill: var(--cream); opacity: 0;
      animation: fade-up 1s 1.4s ease forwards;
    }
    .subtitle {
      font-family: 'Georgia', serif;
      font-size: 16px; letter-spacing: 6px; font-weight: 400;
      fill: var(--sky); opacity: 0;
      animation: fade-up 1s 1.8s ease forwards;
    }
    .jp-text {
      font-family: serif; font-size: 12px; letter-spacing: 3px;
      fill: var(--sage); opacity: 0;
      animation: fade-up 1s 2.1s ease forwards;
    }

    /* ── underline scribble ── */
    .title-line {
      fill: none; stroke: var(--lav); stroke-width: 2;
      stroke-linecap: round; stroke-dasharray: 280; stroke-dashoffset: 280;
      animation: draw 1s 2.3s ease forwards;
    }

    /* ── star scribbles ── */
    .star-arm {
      stroke: var(--lav); stroke-width: 1.5; stroke-linecap: round;
      stroke-dasharray: 30; stroke-dashoffset: 30;
      animation: draw 0.5s ease forwards;
    }

    /* ── dot twinkle ── */
    .twinkle {
      fill: var(--sky); opacity: 0;
      animation: twinkle-anim 3s ease-in-out infinite;
    }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }
    @keyframes grow {
      from { opacity: 0; transform: scaleY(0); }
      to   { opacity: 0.75; transform: scaleY(1); }
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes float-particle {
      0%   { opacity: 0; transform: translate(0, 0); }
      20%  { opacity: 0.6; }
      80%  { opacity: 0.4; }
      100% { opacity: 0; transform: translate(var(--dx, 20px), var(--dy, -40px)); }
    }
    @keyframes twinkle-anim {
      0%,100% { opacity: 0.15; r: 2; }
      50%      { opacity: 0.85; r: 3.5; }
    }
  </style>

  <defs>
    <!-- Nurture sky gradient: deep dusk blue → soft sage horizon -->
    <linearGradient id="nurtureBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1e2b" />
      <stop offset="55%"  stop-color="#12303f" />
      <stop offset="85%"  stop-color="#1a4040" />
      <stop offset="100%" stop-color="#1e3d30" />
    </linearGradient>
    <!-- Meadow ground gradient -->
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1e4035" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#162b20" />
    </linearGradient>
  </defs>

  <!-- BACKGROUND -->
  <rect width="900" height="220" class="bg" rx="12"/>

  <!-- GROUND -->
  <ellipse cx="450" cy="240" rx="520" ry="80" fill="url(#groundGrad)" />

  <!-- ── HORIZON LINE (main scribble wave) ── -->
  <path class="horizon"
    d="M0,155 C50,140 120,165 200,148 C280,132 350,162 430,145
       C510,128 580,158 660,142 C730,128 800,152 900,140" />

  <!-- ── HORIZON LINE 2 (softer echo) ── -->
  <path class="horizon2"
    d="M0,165 C60,175 140,158 220,168 C300,178 370,155 450,166
       C530,177 600,157 680,167 C760,177 840,160 900,168"
    style="animation-delay:0.8s" />

  <!-- ── CLOUD SCRIBBLES ── -->
  <path class="cloud-stroke"
    d="M80,60 C90,48 105,42 118,47 C112,38 125,34 136,39 C148,32 162,36 165,47 C175,43 180,52 172,58 Z"
    style="animation-delay:0.3s" />
  <path class="cloud-stroke"
    d="M620,45 C632,35 650,30 664,36 C658,26 674,22 686,28 C700,21 716,26 718,37 C728,33 732,44 722,50 Z"
    style="animation-delay:0.6s" />

  <!-- ── GRASS BLADES ── -->
  <!-- left cluster -->
  <line class="blade" x1="30"  y1="175" x2="26"  y2="150" style="animation-delay:1.0s"/>
  <line class="blade" x1="37"  y1="175" x2="40"  y2="147" style="animation-delay:1.1s"/>
  <line class="blade" x1="44"  y1="175" x2="47"  y2="153" style="animation-delay:1.2s"/>
  <line class="blade" x1="51"  y1="175" x2="54"  y2="149" style="animation-delay:1.3s"/>
  <!-- mid-left -->
  <line class="blade" x1="200" y1="175" x2="197" y2="152" style="animation-delay:1.1s"/>
  <line class="blade" x1="207" y1="175" x2="210" y2="148" style="animation-delay:1.2s"/>
  <line class="blade" x1="214" y1="175" x2="216" y2="154" style="animation-delay:1.3s"/>
  <!-- center -->
  <line class="blade" x1="430" y1="175" x2="428" y2="150" style="animation-delay:1.0s"/>
  <line class="blade" x1="437" y1="175" x2="440" y2="147" style="animation-delay:1.1s"/>
  <line class="blade" x1="444" y1="175" x2="446" y2="153" style="animation-delay:1.2s"/>
  <!-- right cluster -->
  <line class="blade" x1="680" y1="175" x2="678" y2="151" style="animation-delay:1.1s"/>
  <line class="blade" x1="687" y1="175" x2="690" y2="147" style="animation-delay:1.2s"/>
  <line class="blade" x1="694" y1="175" x2="696" y2="153" style="animation-delay:1.3s"/>
  <line class="blade" x1="860" y1="175" x2="858" y2="152" style="animation-delay:1.0s"/>
  <line class="blade" x1="867" y1="175" x2="870" y2="148" style="animation-delay:1.1s"/>
  <line class="blade" x1="874" y1="175" x2="876" y2="154" style="animation-delay:1.2s"/>

  <!-- ── STAR SCRIBBLES ── -->
  <!-- top-left star -->
  <line class="star-arm" x1="55" y1="22" x2="55" y2="40" style="animation-delay:0.5s"/>
  <line class="star-arm" x1="46" y1="31" x2="64" y2="31" style="animation-delay:0.6s"/>
  <line class="star-arm" x1="49" y1="25" x2="61" y2="37" style="animation-delay:0.7s"/>
  <line class="star-arm" x1="61" y1="25" x2="49" y2="37" style="animation-delay:0.8s"/>
  <!-- top-right star -->
  <line class="star-arm" x1="844" y1="18" x2="844" y2="38" style="animation-delay:0.4s"/>
  <line class="star-arm" x1="834" y1="28" x2="854" y2="28" style="animation-delay:0.5s"/>
  <line class="star-arm" x1="837" y1="21" x2="851" y2="35" style="animation-delay:0.6s"/>
  <line class="star-arm" x1="851" y1="21" x2="837" y2="35" style="animation-delay:0.7s"/>

  <!-- ── TWINKLING DOTS ── -->
  <circle class="twinkle" cx="140" cy="40"  r="2.5" style="animation-delay:0.0s"/>
  <circle class="twinkle" cx="300" cy="20"  r="2"   style="animation-delay:0.7s"/>
  <circle class="twinkle" cx="500" cy="28"  r="3"   style="animation-delay:1.3s"/>
  <circle class="twinkle" cx="700" cy="18"  r="2"   style="animation-delay:0.4s"/>
  <circle class="twinkle" cx="780" cy="55"  r="2.5" style="animation-delay:1.0s"/>
  <circle class="twinkle" cx="220" cy="88"  r="1.8" style="animation-delay:0.6s"/>
  <circle class="twinkle" cx="660" cy="72"  r="2"   style="animation-delay:1.5s"/>

  <!-- ── FLOATING PARTICLES ── -->
  <circle class="particle" cx="320" cy="140" r="2.5"
    style="--dx:15px; --dy:-55px; animation-delay:0.5s; animation-duration:7s"/>
  <circle class="particle" cx="580" cy="135" r="2"
    style="--dx:-10px; --dy:-60px; animation-delay:1.2s; animation-duration:8s"/>
  <circle class="particle" cx="450" cy="155" r="1.8"
    style="--dx:8px;  --dy:-45px; animation-delay:2.0s; animation-duration:6s"/>
  <circle class="particle" cx="200" cy="148" r="2"
    style="--dx:-15px; --dy:-50px; animation-delay:0.8s; animation-duration:9s"/>

  <!-- ── TITLE TEXT ── -->
  <text class="title" x="450" y="100" text-anchor="middle">Brent Abrazaldo</text>

  <!-- scribble underline beneath title -->
  <path class="title-line"
    d="M294,112 C330,118 380,107 420,113 C460,119 500,106 540,112 C565,116 590,108 608,113"
    style="animation-delay:2.3s"/>

  <text class="subtitle" x="450" y="128" text-anchor="middle">CS STUDENT · WEB DEV · OPEN SOURCE</text>

  <text class="jp-text" x="450" y="148" text-anchor="middle">コードを書く · 音楽を聴く · 空を見る</text>

</svg>
